# A BTC/ETH pairs strategy driven by the running spread's z-score, trading
# reversion from *both* tails.
#
# The traded instrument is the spread `close(BTC) − close(ETH)`, and the
# strategy is long / flat / short on it. Which leg does the converging is
# irrelevant — that is what the hedge removes — but the sign is not optional:
#
#   z ≤ −2σ  spread unusually cheap → LONG the spread  (long BTC, short ETH)
#   z ≥ +2σ  spread unusually rich  → SHORT the spread (short BTC, long ETH)
#
# Both sides exit on reversion through 0 and are sized 50/50 against equity
# (1.0× gross, dollar-neutral). Each carries a spread-level bracket:
#
#   * stop_loss   — the cointegration relationship broke; cut at 4σ adverse
#   * take_profit — favourable overshoot at 1σ; lock it in
#
# Note the brackets are mirrored between the sides. The long-spread side loses
# as the spread falls, so its stop sits *below* the mean; the short-spread side
# loses as the spread rises, so its stop sits *above*. Same for the targets.
#
# The two directions are inverse positions, so they are mutually exclusive in
# time and share one capital pool at full notional. Drop the `short_spread:`
# block for a long-spread-only pair.
#
# The internal spread indicator in `PairsStrategy` is always the raw
# `close(left) − close(right)` diff, so *level* expressions must land in
# raw-spread units. The recipe below writes each level as
# `spread_ma ± k·spread_sd`, which is raw-spread by construction.
#
# Reusable subtrees are wired via YAML anchors: `&name` at the first use site,
# `*name` everywhere else. `serde_norway` inlines each alias before the spec
# is deserialized, so the whole graph reads as if the subtrees were repeated
# verbatim, without paying to build them more than once at load time.
#
# Run with (both legs join on `time` from separate `--series`; `--crypto -f 1d`
# sets the annualization to 365 bars/year for 24/7 markets):
#
#   fugazi run pairs:@examples/pairs.yml \
#              --series @btc.csv \
#              --series @eth.csv \
#              --output-dir out/ \
#              --crypto -f 1d
#
# Signal / level tags:
#   !close { source: !pick { symbol: <SYM> } } — the close of one asset in the pair.
#   !sub / !add / !mul / !div                  — arithmetic combinators.
#   !sma / !stddev { period, source }          — the windowed statistics.
#   !above / !below { source, level }          — compare a source against a scalar.

left: BTC
right: ETH

# Named subtrees, defined at first use and referenced by alias thereafter:
#   *spread     — close(BTC) − close(ETH)
#   *spread_ma  — 60-bar SMA of the spread (the mean-reversion anchor)
#   *spread_sd  — 60-bar rolling stddev of the spread
#   *z_score    — (spread − mean) / stddev, what both sides threshold on.
#
# The z-score is spelled out here rather than written as `!zscore { source:
# *spread, period: 60 }` — which computes the same thing — because the mean and
# stddev are needed separately below, for the spread-level brackets.

# --- long the spread: the cheap tail (long BTC, short ETH) ------------------
long_spread:
  enter: !below
    source: &z_score !div
      lhs: !sub
        lhs: &spread !sub
            lhs: !close { source: !pick { symbol: BTC } }
            rhs: !close { source: !pick { symbol: ETH } }
        rhs: &spread_ma !sma { period: 60, source: *spread }
      rhs: &spread_sd !stddev { period: 60, source: *spread }
    level: -2.0

  exit: !above { source: *z_score, level: 0.0 }

  # Adverse for this side is the spread *falling*: stop at mean − 4σ. In
  # raw-spread units, directly comparable to the internal spread indicator.
  stop_loss: !sub
    lhs: *spread_ma
    rhs: !mul { lhs: *spread_sd, rhs: !value 4.0 }

  # Favourable overshoot at mean + 1σ. Asymmetric with the stop by design:
  # pairs-trading blowups are one-sided (the relationship breaks), so cut wider
  # there and take profits on the more common healthy reversion.
  take_profit: !add
    lhs: *spread_ma
    rhs: !mul { lhs: *spread_sd, rhs: !value 1.0 }

# --- short the spread: the rich tail (short BTC, long ETH) ------------------
# The exact mirror. Note every comparison and every bracket flips sign, because
# this side profits as the spread falls.
short_spread:
  enter: !above { source: *z_score, level: 2.0 }

  exit: !below { source: *z_score, level: 0.0 }

  # Adverse for this side is the spread *rising*: stop at mean + 4σ.
  stop_loss: !add
    lhs: *spread_ma
    rhs: !mul { lhs: *spread_sd, rhs: !value 4.0 }

  take_profit: !sub
    lhs: *spread_ma
    rhs: !mul { lhs: *spread_sd, rhs: !value 1.0 }
