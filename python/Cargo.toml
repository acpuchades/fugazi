[package]
name = "fugazi-python"
version = "0.71.0"
edition = "2024"
description = "Python bindings for the fugazi incremental technical-analysis library"
license = "MIT"
publish = false

# The compiled extension module is imported as `fugazi` from Python. The package
# is named `fugazi-python` so it does not collide with the core `fugazi` crate it
# depends on (renamed to `fugazi_core` below to avoid an in-crate name clash).
[lib]
name = "fugazi"
crate-type = ["cdylib"]

[dependencies]
# `sources` for the remote candle providers, `runtime` for the shared
# type-erasure vocabulary (fugazi::runtime — DynIndicator + DynValue + Adapter +
# typed views), `spec` for the YAML load/backtest/optimize kernel, `live` for the
# OKX perpetual-swap wallet (adds hmac/sha2/base64; reqwest/tokio already come in
# via `sources`). Skipping the default `cli` feature keeps clap/csv/interim/etc.
# out of the wheel. Nothing in the CLI stack links system libs anymore, but the
# wheel still doesn't want that surface area (no clap-parsed args, no console I/O).
fugazi_core = { package = "fugazi", path = "..", default-features = false, features = ["sources", "runtime", "spec", "live", "montecarlo"] }
# `abi3-py311` rather than `abi3-py39`: the buffer protocol
# (`pyo3::buffer::PyBuffer`) is gated behind `Py_3_11` under the limited API,
# and without it every numeric column crossing the FFI boundary is read one
# Python `float` at a time. That cost ~155 ns per element against ~1-13 ns of
# actual indicator work — the boundary dominated by an order of magnitude.
# Python 3.9 went EOL in October 2025 and 3.10 follows in October 2026, so the
# floor moves rather than the numbers staying bad.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
anyhow = "1"
