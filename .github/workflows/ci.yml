name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Scope to the core crate: the `fugazi-python` member links libpython via
      # pyo3's extension-module feature and can't be `cargo test`ed standalone.
      # Its Rust + Python surface is exercised by the `python` job below.
      # FUGAZI_REQUIRE_FIXTURES turns a missing-or-stale cross-validation
      # fixture into a failure instead of a skip. Both fixtures
      # (tests/data/{talib,metrics}_expected.csv) are committed, so this should
      # always hold — and if someone adds an indicator to the generator without
      # regenerating, or re-ignores a fixture, CI says so instead of quietly
      # comparing nothing. A skip is indistinguishable from a pass, which is how
      # the TA-Lib check sat inert for months.
      - name: Test
        run: cargo test -p fugazi
        env:
          FUGAZI_REQUIRE_FIXTURES: "1"
      - name: Clippy
        run: cargo clippy -p fugazi --all-targets -- -D warnings
      # `fugazi-derive` is an unconditional dependency providing both
      # `#[derive(SaveState)]` and `#[derive(SpecGrammar)]` — the latter backs
      # `spec_grammar()`, `fugazi list indicators`, `fugazi schema` and `fugazi
      # grammar`. It was linted by nothing. Free to add: no Python needed.
      - name: Clippy (derive crate)
        run: cargo clippy -p fugazi-derive --all-targets -- -D warnings
      # The doc lints in src/lib.rs only fire here. A doc comment that loses its
      # item reattaches to whatever follows, silently — which is how `Portfolio`
      # ended up undocumented with its prose on a private type alias.
      - name: Docs
        run: cargo doc --no-deps -p fugazi
        env:
          RUSTDOCFLAGS: "-D warnings"

      # What `cargo publish` would actually upload. 0.66.0 reached PyPI and
      # never reached crates.io because a `git add -A` swept 15.5 MiB of scratch
      # screenshots into the tree, putting the tarball at 17.11 MiB against
      # crates.io's 10 MiB cap — and an over-size upload comes back as a bare
      # 503 from the CDN with an empty body, which reads exactly like an outage.
      # It cost four retries and a wrong diagnosis. Catch it at push time, where
      # the error can say what it is.
      #
      # `--workspace --exclude fugazi-python` rather than `-p fugazi`: the root
      # pins `fugazi-derive` by *registry version*, so `-p fugazi` resolves that
      # against crates.io and fails on every release commit — the bumped derive
      # is not published yet. Packaging both members together resolves it by
      # path. `fugazi-python` is excluded because it is not published as a crate.
      - name: Package size
        run: |
          cargo package --workspace --exclude fugazi-python --no-verify --allow-dirty
          crate=$(find target/package -maxdepth 1 -name 'fugazi-*.crate' \
                    ! -name 'fugazi-derive-*' -printf '%s %p\n' |
                  sort -rn | head -1)
          bytes=${crate% *}
          path=${crate#* }
          budget=$((5 * 1024 * 1024))
          printf 'packaged %s at %.2f MiB (budget %d MiB, crates.io cap 10 MiB)\n' \
            "$path" "$(echo "$bytes/1048576" | bc -l)" "$((budget / 1024 / 1024))"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::packaged crate is over the budget — check for files that should be in Cargo.toml's exclude"
            exit 1
          fi

  # The seven places a version bump has to touch (CLAUDE.md lists them). `cargo`
  # enforces exactly one pair — the root's `fugazi-derive` pin against the
  # derive crate's own version. The rest were hand-maintained, which is how
  # `python/uv.lock` sat at 0.42.0 through nine releases.
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: All seven places agree
        run: |
          set -euo pipefail
          fail=0
          root=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "root Cargo.toml: $root"
          check() { # check <label> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          check "fugazi-derive/Cargo.toml" \
            "$(grep -m1 '^version = ' fugazi-derive/Cargo.toml | cut -d'"' -f2)" "$root"
          check "root fugazi-derive pin" \
            "$(grep -m1 'fugazi-derive = ' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')" "$root"
          check "python/Cargo.toml" \
            "$(grep -m1 '^version = ' python/Cargo.toml | cut -d'"' -f2)" "$root"
          check "python/pyproject.toml" \
            "$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)" "$root"
          # uv.lock pins the exact version; nothing reads it, so it drifts silently.
          check "python/uv.lock" \
            "$(grep -A2 '^name = "fugazi"$' python/uv.lock | grep -m1 '^version = ' | cut -d'"' -f2)" \
            "$root"
          # README advertises major.minor only.
          check "README.md install snippet" \
            "$(grep -m1 'fugazi = "' README.md | cut -d'"' -f2)" \
            "$(echo "$root" | cut -d. -f1,2)"
          exit $fail

  # `fugazi` is heavily feature-gated, and the default set (`sources` + `cli`)
  # is only one point in the space. Cargo.toml documents each of these as a
  # supported standalone configuration; without this job that claim is
  # unchecked, and `live` — which nothing else compiles — could rot silently.
  # `cargo check` rather than `cargo test`: this guards *compilation* under each
  # gate, and the behaviour is covered by the default-feature job above.
  #
  # Restricted rows check `--lib` rather than `--all-targets`, because the
  # integration tests in `tests/` reach for `fugazi::spec` unconditionally —
  # they're written against the full surface, which is the right call for them.
  # The `--all-features` row is the one that covers every target.
  features:
    name: Feature matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pure library: no async stack, no type erasure, no YAML.
          - features: "--no-default-features"
          # Each optional feature standing alone, as its Cargo.toml comment
          # promises a downstream caller can enable it.
          - features: "--no-default-features --features runtime"
          - features: "--no-default-features --features sources"
          - features: "--no-default-features --features parallel"
          # What the Python wheel enables (`spec` implies runtime + parallel).
          - features: "--no-default-features --features spec"
          # The live-execution wallets. Not default-on, so this is the only
          # place they are compiled at all.
          - features: "--no-default-features --features live"
          # Everything at once — catches a pair of features that only conflict
          # when both are on.
          - features: "--all-features"
            targets: "--all-targets"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check -p fugazi ${{ matrix.features }} ${{ matrix.targets || '--lib' }}
      - name: Clippy
        run: cargo clippy -p fugazi ${{ matrix.features }} ${{ matrix.targets || '--lib' }} -- -D warnings

  python:
    name: Python bindings (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `python/src` is ~11k lines of Rust that no lint ever saw: every clippy
      # invocation in this file is scoped `-p fugazi`, and `maturin build`
      # catches hard errors only.
      - name: Clippy (bindings)
        run: cargo clippy -p fugazi-python --all-targets -- -D warnings
      - name: Build + install wheel
        working-directory: python
        run: |
          pip install maturin
          maturin build --release --out dist
          pip install --no-index --find-links dist fugazi
      # Mirrors the `test` extra in python/pyproject.toml. `jsonschema` and
      # `pyyaml` are load-bearing: the two schema test files `importorskip`
      # them, so leaving them out makes those files skip silently rather than
      # fail — the schema tests then pass by not running. `mypy` is the same
      # kind of load-bearing for `test_stubs.py`, which type-checks the shipped
      # `.pyi` files.
      - name: Install test deps
        run: pip install pytest numpy pandas polars jsonschema pyyaml mypy
      - name: pytest
        working-directory: python
        run: pytest
