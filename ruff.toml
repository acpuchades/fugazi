# Python formatting for the whole repo — the bindings' tests and bench under
# `python/`, and the fixture generators and plotting scripts under `tools/`.
#
# Root-level rather than a `[tool.ruff]` block in `python/pyproject.toml`,
# because `tools/` is outside that directory and would otherwise fall back to
# ruff's built-in defaults — two configurations for one repo, differing
# silently. Ruff walks up from each file to the nearest config; with no
# `[tool.ruff]` section in `python/pyproject.toml` it skips that file and finds
# this one, so both trees resolve here.
#
# `ruff format --check .` is the gate (`scripts/ci-local.sh fmt`, and the
# `Formatting` job in `.github/workflows/ci.yml`). `scripts/hooks/pre-commit`
# runs the fixing form over staged files.
#
# Only the formatter is wired. Ruff's *linter* is a separate, much larger
# decision — a rule set to pick, a backlog to burn down — and this file does not
# make it: `ruff check` is not run anywhere. Adding `[lint]` here is a real
# choice, not a config tweak.

# Ruff's default. The tree already sits under it (p99 = 87 characters across
# every committed .py), so it costs nothing and it matches what a contributor
# gets from a bare `ruff format`.
line-length = 88

# The floor `python/pyproject.toml` declares in `requires-python`. The formatter
# reads it for the few constructs whose layout is version-dependent; stating it
# means the output does not move when ruff's inferred default does.
target-version = "py311"

# Ruff already honours .gitignore and skips virtualenvs, which covers
# `python/.venv` and `.pixi/`. Named anyway are the two generated trees that are
# *not* always ignored:
extend-exclude = [
    "python/fugazi/*.pyi", # generated by tools/gen_python_stubs.py, diffed by
                           # python/tests/test_stubs.py — formatting them here
                           # would fight the generator
    "target",              # cargo scratch; may hold vendored .py from a build
]

[format]
# Spelled out because these are the settings a future ruff release could move,
# and the committed diff of a reformat should be attributable to the code.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = false
