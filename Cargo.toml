[package]
name = "fugazi"
version = "0.61.0"
edition = "2024"
description = "A library of incremental technical-analysis indicators, signals and strategies"
license = "MIT"
repository = "https://github.com/acpuchades/fugazi"
readme = "README.md"
keywords = ["trading", "technical-analysis", "indicators", "finance", "incremental"]
categories = ["finance", "mathematics"]

[lib]
name = "fugazi"
path = "src/lib.rs"

# The `fugazi` binary is the command-line backtester: it loads a strategy.yml,
# assembles candle data from one or more --series, and runs it through a paper
# wallet (see `src/cli/`). Its dependencies are gated behind the `cli` feature
# below; the library proper keeps its dependency footprint minimal — `serde` +
# `serde_json` (used in the `sources` module and by the CLI's YAML/JSON plumbing),
# `time` (for the calendar sources' `Timestamp` decomposition), and `statrs` (for
# the standard-normal CDF/inverse-CDF that back the higher-moment Sharpe
# corrections in `fugazi::metrics`). Everything else is behind the `sources` /
# `cli` features.
[[bin]]
name = "fugazi"
path = "src/cli/main.rs"
required-features = ["cli"]

# The live-wallet smoke test needs the `live` feature (OKX demo trading).
[[example]]
name = "okx_demo"
required-features = ["live"]

# `sources` pulls in the async HTTP stack the remote candle providers
# (`fugazi::sources`) rely on. `cli` pulls in everything only the binary uses.
# All CLI deps are pure Rust — no system libraries link in, so the Python wheel
# (which still turns `cli` off via `default-features = false, features = ["sources"]`)
# and the CLI build follow the same manylinux-friendly path. Both features are
# default-on so `cargo build` builds the CLI unchanged.
[features]
default = ["sources", "cli"]
# `csv` and `zip` are here rather than under `cli` because `binance_vision`
# fetches ZIP-of-CSV archives rather than a JSON API — the parsing is part of
# the source, not of the command line. That does widen the Python wheel, which
# enables `sources`; `zip` is taken with default features off so only `deflate`
# (the compression Binance actually uses) is compiled in.
sources = ["dep:reqwest", "dep:tokio", "dep:thiserror", "dep:csv", "dep:zip"]
# `runtime` compiles the pure, no-extra-deps type-erasure vocabulary
# (`fugazi::runtime`) that YAML/JSON-driven builders and the Python bindings
# use to nest indicators whose types are only known at runtime. The `cli`
# feature implies it; a caller who only wants that vocabulary can enable it
# on its own (`default-features = false, features = ["runtime"]`).
runtime = []
# `parallel` exposes `fugazi::backtest::run_many` — a rayon-backed ensemble
# driver that par-iters over `(strategy, wallet)` pairs against a shared
# snapshot stream. The `cli` feature implies it (rayon is already in the
# CLI's own dep list); a caller who wants the ensemble primitive without
# the CLI enables it on its own (`features = ["parallel"]`).
parallel = ["dep:rayon"]
# `live` compiles the live-execution wallets (`fugazi::live`) — downstream
# `Wallet` impls that route orders to a real broker instead of an in-memory
# paper book. It builds on `sources` (which already pulls in the async
# `reqwest`/`tokio` stack the REST clients use) and adds the request signing
# every private venue endpoint requires: `hmac` + `sha2` for OKX's
# HMAC-SHA256, `base64` for its base64 signatures, and `p256` for Coinbase
# Advanced Trade's ES256 (ECDSA P-256) JWTs. Not default-on: `cargo build` and
# the Python wheel are unaffected.
live = ["sources", "dep:hmac", "dep:sha2", "dep:base64", "dep:p256"]
# `spec` compiles the YAML-driven declarative surface (`fugazi::spec`) — the
# `*Spec` types, `evaluate*` / `measured_report*` / `optimize` kernel,
# `Metrics` document + `MetricKey`, `CostConfig`, `WindowSpec`, and the
# `!import` / `!param` / `!arg` load passes. It's what a downstream crate
# (the Python bindings, a hosting server, a batch runner) enables to reach
# through to the strategy vocabulary without pulling in the CLI's clap /
# progress / csv / date-parsing stack. Depends on `runtime` (all builders
# resolve into `DynIndicator` chains) and on `serde_norway` + `anyhow` (YAML
# in, structured errors out); the CLI-only bits (indicatif progress bars,
# console styling, csv output, interim date parsing) stay behind `cli`.
spec = ["runtime", "parallel", "dep:serde_norway", "dep:anyhow"]
# `montecarlo` compiles the resampling-based significance layer
# (`fugazi::montecarlo` + `fugazi::spec::montecarlo`): block/stationary
# bootstrap of returns for confidence intervals and empirical-null p-values.
# Off by default — it is the crate's only source of (seeded, reproducible)
# randomness, so `rand` + `rand_chacha` stay out of a build that doesn't ask
# for it. The empirical-null re-run path drives whole backtests, so the
# spec-layer half needs `spec`; the `cli` feature turns it on so the
# `run --montecarlo` flag always exists (runtime-gated by the flag, which is
# the user-facing opt-in for the expensive computation).
montecarlo = ["dep:rand", "dep:rand_chacha"]
cli = [
    "spec",
    "sources",
    "montecarlo",
    "dep:clap",
    "dep:clap_complete",
    "dep:indicatif",
    "dep:console",
    "dep:interim",
]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
# `fugazi-derive` provides `#[derive(SaveState)]`, which generates the
# per-indicator run-state save/load bodies for run resuming. It is a normal
# proc-macro dependency (no runtime, no linkage), so it does not affect the
# pyo3 cdylib build.
fugazi-derive = { path = "fugazi-derive", version = "0.61.0" }
# `rc` provides `Serialize`/`Deserialize` for `Arc<str>` — the crate's `Symbol`
# type. serde gates it because deserializing two `Arc`s that were shared at
# serialize time yields two independent allocations; that is fine here, since a
# `RunState`'s symbols are re-interned on load anyway.
serde = { version = "1", features = ["derive", "rc"] }
serde_norway = { version = "0.9", optional = true }
# `float_roundtrip` makes f64 parse back bit-for-bit identical to what was
# serialized — load-bearing for run resuming, where a 1-ULP drift in a restored
# EMA seed compounds into a divergent equity curve.
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = { version = "1", optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
anyhow = { version = "1", optional = true }
indicatif = { version = "0.18", optional = true }
console = { version = "0.16", optional = true }
rayon = { version = "1", optional = true }
# Seeded, reproducible RNG for the `montecarlo` feature. `rand_chacha`'s
# ChaCha8Rng is a portable, deterministic stream given a `u64` seed — the
# same permutation set on every platform, so a reported p-value/CI reproduces.
# `default-features = false` drops `getrandom` (we never seed from the OS).
rand = { version = "0.9", default-features = false, features = ["std"], optional = true }
rand_chacha = { version = "0.9", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "gzip"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"], optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
statrs = { version = "0.18", default-features = false }
thiserror = { version = "2", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
# ECDSA P-256 signing for Coinbase Advanced Trade's ES256 JWTs (the `live`
# feature). Pure-Rust, no OS RNG: signatures use deterministic RFC 6979, so no
# `getrandom`. `pem`/`pkcs8` parse the CDP key file's PEM private key.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"], optional = true }
interim = { version = "0.2.1", default-features = false, features = ["std", "time_0_3"], optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
# The `live` Coinbase wallet test builds a throwaway P-256 key to construct the
# wallet (the mock doesn't verify the JWT, but construction parses a real key).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
# The benchmark harness (`benches/`). `default-features = false` drops the
# plotting/HTML-report stack — the numbers are read from the terminal and from
# `scripts/perf-compare.sh`, not from generated charts, and gnuplot/plotters
# would be a large dependency tree for output nobody reads. Benches are
# deliberately **not** wired into CI (`scripts/ci-local.sh` /
# `.github/workflows/ci.yml`, which `tests/ci_mirror.rs` holds in sync): they
# are a development instrument, not a gate.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Benchmark targets. Each needs `harness = false` so criterion's own runner
# takes over from libtest; `footprint` is not a criterion bench at all but a
# plain `fn main()` probe that installs a counting global allocator (which it
# could not do inside a criterion target without also counting criterion's own
# allocations).
[[bench]]
name = "tree"
harness = false

[[bench]]
name = "indicators"
harness = false

[[bench]]
name = "driver"
harness = false

[[bench]]
name = "multi_asset"
harness = false

[[bench]]
name = "wallet"
harness = false

[[bench]]
name = "metrics"
harness = false

[[bench]]
name = "footprint"
harness = false

[[bench]]
name = "icount"
harness = false

[[bench]]
name = "breaking"
harness = false

[[bench]]
name = "three_tier"
harness = false

[[bench]]
name = "stddev_tradeoff"
harness = false

[[bench]]
name = "erasure"
harness = false

# The per-bar hot path is generic code that crosses module boundaries
# (`Combine<L, R, Op>` over sources defined elsewhere) plus trait objects, so
# cross-CGU inlining is worth more here than it is for the average crate.
#
# Measured on one source tree built three ways, quiet machine, both instruments
# (callgrind instruction counts and criterion wall-clock — see
# `docs/PERFORMANCE.md`):
#
#   | config                | rebuild | instructions  | wall-clock (median) |
#   |-----------------------|--------:|--------------:|--------------------:|
#   | (untuned)             |     42s |             — |                   — |
#   | lto = "thin"          |     45s |  -1.7 … -5.0% |               -6.8% |
#   | lto = "thin", cgu = 1 |     68s |  -8.9 … -20.1%|              -24.1% |
#
# `codegen-units = 1` is the setting that carries this, and it earns its +23s:
# the dyn/YAML paths gain most (-17% instructions on `sma_yaml`, -20% on a
# depth-8 tree), which is what you would expect when the per-bar hot path is
# generic code crossing module boundaries plus trait objects.
#
# Thin LTO alone is marginal and its wall-clock is mixed in sign (+8% on some
# `tree/update` sizes) despite a small instruction *reduction* — i.e. layout
# noise, not a real regression. It is kept because it composes with cgu = 1 at
# negligible cost, not on its own merit.
#
# `panic = "abort"` is deliberately *not* set: `Snapshot::sole_atom` panics as a
# documented diagnostic, and the test suite catches it with `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1

# `cargo bench` uses this profile, and a benchmark that isn't built the way a
# release consumer builds is measuring the wrong thing.
[profile.bench]
lto = "thin"
codegen-units = 1

# The Python bindings live in their own workspace member (`python/`), which is
# the only crate that pulls in PyO3 — see that crate's README for build
# instructions.
[workspace]
members = ["python", "fugazi-derive"]
resolver = "2"
