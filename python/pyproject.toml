[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fugazi"
version = "0.69.0"
description = "Python bindings for the fugazi incremental technical-analysis library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["trading", "technical-analysis", "indicators", "finance", "incremental"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    # The wheel is abi3-py311 (see `pyo3`'s features in Cargo.toml), so one
    # binary serves every version below. These are metadata only — PyPI's
    # sidebar and the `pypi/pyversions` README badge read them, nothing
    # enforces them; `requires-python` above is the real floor.
    #
    # The floor is 3.11 because the buffer protocol is unavailable to an
    # abi3 build below it, and without it the FFI boundary costs more than the
    # engine (see `docs/PERFORMANCE.md`). 3.9 and 3.10 are EOL / near-EOL.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Documentation = "https://github.com/acpuchades/fugazi/blob/main/docs/PYTHON.md"
Repository = "https://github.com/acpuchades/fugazi"
Issues = "https://github.com/acpuchades/fugazi/issues"
Changelog = "https://github.com/acpuchades/fugazi/releases"
Funding = "https://github.com/sponsors/acpuchades"

[project.optional-dependencies]
test = ["pytest", "numpy", "pandas", "polars", "jsonschema", "pyyaml", "mypy"]

[tool.maturin]
# The crate's `[lib] name = "fugazi"` produces the importable module.
module-name = "fugazi"
features = ["pyo3/extension-module"]
# Mixed layout: `fugazi/` is a real package directory, so the wheel can carry
# `py.typed` and the generated `.pyi` stubs beside the compiled extension. Its
# `__init__.py` is the same re-export shim maturin writes for a pure-extension
# build — see the docstring there. Regenerate the stubs with
# `python tools/gen_python_stubs.py`; `tests/test_stubs.py` fails on a stale one.
python-source = "."
include = ["fugazi/py.typed", "fugazi/*.pyi"]
